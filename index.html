<!DOCTYPE html>
<html lang="en-GB" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>tigabelas</title>
  <meta name="description" content="Full-month activity calendar." />

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />

  <!-- Tailwind (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Leaflet (peta, gratis tanpa API key) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <link rel="stylesheet" href="style.css" />
</head>

<body class="min-h-screen bg-neutral-50 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100 font-sans antialiased transition-colors duration-300">

  <!-- ===== Header ===== -->
  <header class="sticky top-0 z-30 border-b border-neutral-200 bg-neutral-50/80 backdrop-blur-md dark:border-neutral-800 dark:bg-neutral-950/80">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4 sm:px-6">
      <!-- Brand -->
      <div class="flex items-center">
        <h1 class="text-base font-bold tracking-tight sm:text-lg">tgbls.com</h1>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2">
        <!-- Theme toggle: Toggle between Dark Mode & White Pink -->
        <button id="themeToggleBtn" type="button" title="Toggle theme"
          class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-neutral-200 bg-transparent transition hover:bg-neutral-100 dark:border-neutral-800 dark:hover:bg-neutral-800">
          <span id="themeToggleIcon" class="flex items-center justify-center"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== Main ===== -->
  <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6 sm:py-8">
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">

      <!-- Calendar -->
      <section class="lg:col-span-2">
        <div id="calendarCard" class="rounded-2xl border border-neutral-200 bg-white p-4 shadow-sm dark:border-neutral-800 dark:bg-neutral-900 sm:p-6">
          <!-- Month nav -->
          <div class="mb-5 flex items-center justify-between gap-3">
            <div>
              <h2 id="monthTitle" class="text-xl font-bold tracking-tight sm:text-2xl">—</h2>
              <p id="countdownText" class="mt-0.5 text-xs font-semibold tabular-nums text-neutral-500 dark:text-neutral-400">—</p>
            </div>
            <div class="flex items-center gap-1.5">
              <button id="todayBtn" type="button"
                class="hidden h-9 items-center rounded-lg border border-neutral-200 px-3 text-sm font-medium transition hover:bg-neutral-100 dark:border-neutral-800 dark:hover:bg-neutral-800 sm:inline-flex">
                Today
              </button>
              <button id="prevBtn" type="button" title="Previous month"
                class="flex h-9 w-9 items-center justify-center rounded-lg border border-neutral-200 transition hover:bg-neutral-100 dark:border-neutral-800 dark:hover:bg-neutral-800">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
              </button>
              <button id="nextBtn" type="button" title="Next month"
                class="flex h-9 w-9 items-center justify-center rounded-lg border border-neutral-200 transition hover:bg-neutral-100 dark:border-neutral-800 dark:hover:bg-neutral-800">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
              </button>
            </div>
          </div>

          <!-- Weekday header -->
          <div id="weekdayRow" class="mb-1 grid grid-cols-7 gap-1.5 text-center text-xs font-semibold uppercase tracking-wide text-neutral-400 dark:text-neutral-500"></div>

          <!-- Day grid -->
          <div id="calendarGrid" class="grid grid-cols-7 gap-1.5"></div>
        </div>
      </section>

      <!-- Sidebar -->
      <aside id="sidebar" class="flex flex-col gap-4 lg:col-span-1">

        <!-- Stats card -->
        <div class="rounded-2xl border border-neutral-200 bg-white p-4 shadow-sm dark:border-neutral-800 dark:bg-neutral-900 sm:p-5">
          <div class="mb-3 flex items-center justify-between gap-2">
            <h3 class="text-base font-bold tracking-tight">This Year's Stats</h3>
            <button id="openReceiptBtn" type="button" title="Share stats"
              class="inline-flex h-8 items-center gap-1.5 rounded-lg border border-neutral-200 px-3 text-xs font-semibold text-neutral-600 transition hover:bg-neutral-100 dark:border-neutral-800 dark:text-neutral-300 dark:hover:bg-neutral-800">
              <svg class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" /><path stroke-linecap="round" stroke-linejoin="round" d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4" /></svg>
              <span>Share</span>
            </button>
          </div>
          <div class="relative">
            <div id="statsGrid" class="grid grid-cols-2 gap-2 transition-all duration-300"></div>
            <div id="statsFade" class="pointer-events-none absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-white to-transparent dark:from-neutral-900"></div>
          </div>
          <div id="statsToggleWrap" class="mt-2 flex justify-center"></div>
        </div>

        <!-- Upcoming card -->
        <div class="flex min-h-0 flex-1 flex-col rounded-2xl border border-neutral-200 bg-white p-4 shadow-sm dark:border-neutral-800 dark:bg-neutral-900 sm:p-6">
          <div class="mb-4 flex items-center justify-between">
            <h3 class="text-base font-bold tracking-tight">Upcoming Events</h3>
            <span id="upcomingCount" class="rounded-full bg-neutral-100 px-3.5 py-0.5 text-[11px] font-semibold text-neutral-600 dark:bg-neutral-800 dark:text-neutral-300">0</span>
          </div>
          <div id="upcomingList" class="space-y-2 lg:min-h-0 lg:flex-1 lg:overflow-y-auto lg:pr-1"></div>
          <div id="upcomingPager" class="mt-3 hidden items-center justify-between gap-2"></div>
        </div>

      </aside>

    </div>
  </main>

  <footer class="mx-auto max-w-6xl px-4 pb-10 pt-2 text-center text-xs text-neutral-400 dark:text-neutral-600 sm:px-6">
    made with love.
  </footer>



  <!-- ===== Day Modal ===== -->
  <div id="dayModal" class="modal-root fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div class="modal-backdrop absolute inset-0 bg-neutral-900/40 backdrop-blur-sm dark:bg-black/60 animate-fade-in"></div>
    <div class="relative z-10 flex max-h-[85vh] w-full max-w-md flex-col rounded-2xl border border-neutral-200 bg-white shadow-xl dark:border-neutral-800 dark:bg-neutral-900 animate-pop-in">
      <div class="flex items-center justify-between gap-3 border-b border-neutral-200 p-5 dark:border-neutral-800">
        <div class="flex min-w-0 items-center gap-2">
          <h3 id="dayModalTitle" class="truncate text-lg font-bold">—</h3>
          <span id="dayModalDone" class="hidden flex-shrink-0 rounded-md border border-red-500 px-2 py-0.5 text-[11px] font-bold uppercase tracking-wider text-red-500 dark:border-red-500 dark:text-red-400">Done</span>
        </div>
        <button type="button" data-close-modal
          class="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-lg text-neutral-400 transition hover:bg-neutral-100 hover:text-neutral-900 dark:hover:bg-neutral-800 dark:hover:text-white">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>

      <div id="dayModalList" class="flex-1 space-y-2 overflow-y-auto p-5"></div>

      <div id="dayModalFooter" class="flex gap-2 border-t border-neutral-200 p-4 dark:border-neutral-800">
        <!-- filled by JS: add / edit+delete / delete / login hint -->
      </div>
    </div>
  </div>

  <!-- ===== Event Form Modal ===== -->
  <div id="eventModal" class="modal-root fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div class="modal-backdrop absolute inset-0 bg-neutral-900/40 backdrop-blur-sm dark:bg-black/60 animate-fade-in"></div>
    <div class="relative z-10 flex max-h-[90vh] w-full max-w-md flex-col rounded-2xl border border-neutral-200 bg-white shadow-xl dark:border-neutral-800 dark:bg-neutral-900 animate-pop-in">
      <div class="flex items-center justify-between border-b border-neutral-200 px-5 pt-5 pb-3 dark:border-neutral-800">
        <h3 id="eventModalTitle" class="text-lg font-bold">Add Event</h3>
        <button type="button" data-close-modal
          class="flex h-8 w-8 items-center justify-center rounded-lg text-neutral-400 transition hover:bg-neutral-100 hover:text-neutral-900 dark:hover:bg-neutral-800 dark:hover:text-white">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>

      <form id="eventForm" class="flex-1 space-y-4 overflow-y-auto px-5 pb-5 pt-3">
        <input type="hidden" id="eventId" />

        <div>
          <label for="eventTitle" class="mb-1.5 block text-sm font-medium">Event Title <span class="text-neutral-400">*</span></label>
          <input id="eventTitle" type="text" required maxlength="80"
            class="w-full rounded-xl border border-neutral-300 bg-white px-4 py-2.5 text-sm outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10 dark:border-neutral-700 dark:bg-neutral-950 dark:focus:border-white dark:focus:ring-white/10" />
        </div>

        <div>
          <label for="eventDate" class="mb-1.5 block text-sm font-medium">Date <span class="text-neutral-400">*</span></label>
          <input id="eventDate" type="date" required lang="en-GB"
            class="block w-full min-w-0 max-w-full appearance-none rounded-xl border border-neutral-300 bg-white px-4 py-2.5 text-sm outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10 dark:border-neutral-700 dark:bg-neutral-950 dark:focus:border-white dark:focus:ring-white/10" />
        </div>

        <!-- Tag -->
        <div>
          <div class="mb-1.5 flex items-center justify-between">
            <label class="block text-sm font-medium">Tags</label>
            <button type="button" id="manageTagsBtn" class="text-xs font-semibold text-neutral-400 transition hover:text-neutral-900 dark:hover:text-white">Manage tags</button>
          </div>
          <div id="tagPicker" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Timeline (each item can have its own location) -->
        <div>
          <div class="mb-1.5 flex items-center justify-between">
            <label class="block text-sm font-medium">Timeline</label>
            <button type="button" id="addTimelineBtn" class="inline-flex items-center gap-1 text-xs font-semibold text-neutral-400 transition hover:text-neutral-900 dark:hover:text-white">
              <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" d="M12 5v14M5 12h14" /></svg>
              Add item
            </button>
          </div>
          <div id="timelineEditor" class="space-y-2"></div>
        </div>

        <!-- Notes -->
        <div>
          <label for="eventDesc" class="mb-1.5 block text-sm font-medium">Notes</label>
          <textarea id="eventDesc" rows="3" maxlength="300"
            class="w-full resize-none rounded-xl border border-neutral-300 bg-white px-4 py-2.5 text-sm outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10 dark:border-neutral-700 dark:bg-neutral-950 dark:focus:border-white dark:focus:ring-white/10"></textarea>
        </div>

        <div class="flex gap-2 pt-1">
          <button type="button" data-close-modal
            class="flex-1 rounded-xl border border-neutral-200 py-2.5 text-sm font-semibold transition hover:bg-neutral-100 dark:border-neutral-800 dark:hover:bg-neutral-800">
            Cancel
          </button>
          <button type="submit"
            class="flex-1 rounded-xl border border-transparent bg-clip-padding bg-neutral-900 py-2.5 text-sm font-semibold text-white transition hover:bg-neutral-700 dark:bg-white dark:text-neutral-900 dark:hover:bg-neutral-200">
            Save
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== Tag Manager Modal ===== -->
  <div id="tagModal" class="modal-root fixed inset-0 z-[55] hidden items-center justify-center p-4">
    <div class="modal-backdrop absolute inset-0 bg-neutral-900/40 backdrop-blur-sm dark:bg-black/60 animate-fade-in"></div>
    <div class="relative z-10 flex max-h-[85vh] w-full max-w-md flex-col rounded-2xl border border-neutral-200 bg-white shadow-xl dark:border-neutral-800 dark:bg-neutral-900 animate-pop-in">
      <div class="flex items-center justify-between border-b border-neutral-200 p-5 dark:border-neutral-800">
        <div>
          <h3 class="text-lg font-bold">Manage Tags</h3>
          <p class="mt-0.5 text-xs text-neutral-500 dark:text-neutral-400">Add your own custom tags here.</p>
        </div>
        <button type="button" data-close-modal
          class="flex h-8 w-8 items-center justify-center rounded-lg text-neutral-400 transition hover:bg-neutral-100 hover:text-neutral-900 dark:hover:bg-neutral-800 dark:hover:text-white">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>

      <div id="tagManagerList" class="flex flex-1 flex-wrap content-start gap-2 overflow-y-auto p-5"></div>

      <div class="border-t border-neutral-200 p-4 dark:border-neutral-800">
        <div class="flex gap-2">
          <input id="newTagName" type="text" maxlength="24" placeholder="New tag name"
            class="min-w-0 flex-1 rounded-xl border border-neutral-300 bg-white px-3 py-2.5 text-sm outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10 dark:border-neutral-700 dark:bg-neutral-950 dark:focus:border-white dark:focus:ring-white/10" />
          <button type="button" id="addTagBtn"
            class="flex-shrink-0 rounded-xl bg-neutral-900 px-4 text-sm font-semibold text-white transition hover:bg-neutral-700 dark:bg-white dark:text-neutral-900 dark:hover:bg-neutral-200">
            Add
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Map Picker Modal ===== -->
  <div id="mapModal" class="modal-root fixed inset-0 z-[55] hidden items-center justify-center p-4">
    <div class="modal-backdrop absolute inset-0 bg-neutral-900/40 backdrop-blur-sm dark:bg-black/60 animate-fade-in"></div>
    <div class="relative z-10 flex max-h-[90vh] w-full max-w-lg flex-col rounded-2xl border border-neutral-200 bg-white shadow-xl dark:border-neutral-800 dark:bg-neutral-900 animate-pop-in">
      <div class="flex items-center justify-between border-b border-neutral-200 p-5 dark:border-neutral-800">
        <h3 class="text-lg font-bold">Pick Location</h3>
        <button type="button" data-close-modal
          class="flex h-8 w-8 items-center justify-center rounded-lg text-neutral-400 transition hover:bg-neutral-100 hover:text-neutral-900 dark:hover:bg-neutral-800 dark:hover:text-white">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>

      <div class="space-y-3 p-5">
        <div class="flex gap-2">
          <input id="mapSearch" type="text" placeholder="Search place / address…"
            class="min-w-0 flex-1 rounded-xl border border-neutral-300 bg-white px-3 py-2.5 text-sm outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10 dark:border-neutral-700 dark:bg-neutral-950 dark:focus:border-white dark:focus:ring-white/10" />
          <button type="button" id="mapSearchBtn"
            class="flex-shrink-0 rounded-xl border border-neutral-200 px-4 text-sm font-semibold transition hover:bg-neutral-100 dark:border-neutral-800 dark:hover:bg-neutral-800">
            Search
          </button>
        </div>
        <div id="mapContainer" class="h-72 w-full overflow-hidden rounded-xl border border-neutral-200 dark:border-neutral-800"></div>
        <p id="mapSelInfo" class="text-xs text-neutral-500 dark:text-neutral-400">Click on the map or search to pick a location.</p>
      </div>

      <div class="flex gap-2 border-t border-neutral-200 p-4 dark:border-neutral-800">
        <button type="button" data-close-modal
          class="flex-1 rounded-xl border border-neutral-200 py-2.5 text-sm font-semibold transition hover:bg-neutral-100 dark:border-neutral-800 dark:hover:bg-neutral-800">
          Cancel
        </button>
        <button type="button" id="useLocationBtn"
          class="flex-1 rounded-xl border border-transparent bg-clip-padding bg-neutral-900 py-2.5 text-sm font-semibold text-white transition hover:bg-neutral-700 dark:bg-white dark:text-neutral-900 dark:hover:bg-neutral-200">
          Use this location
        </button>
      </div>
    </div>
  </div>



  <!-- Toast container -->
  <div id="toastContainer" class="pointer-events-none fixed bottom-5 left-1/2 z-[60] flex -translate-x-1/2 flex-col items-center gap-2"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
