<!DOCTYPE html>
<html lang="en-GB" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Album — tigabelas.</title>
  <meta name="description" content="Photo album of events." />

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />

  <!-- Tailwind (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } },
    };
  </script>

  <link rel="stylesheet" href="style.css" />
</head>

<body class="min-h-screen bg-neutral-50 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100 font-sans antialiased transition-colors duration-300">

  <!-- ===== Header ===== -->
  <header class="sticky top-0 z-30 border-b border-neutral-200 bg-neutral-50/80 backdrop-blur-md dark:border-neutral-800 dark:bg-neutral-950/80">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4 sm:px-6">
      <div class="flex items-center">
        <h1 class="text-base font-bold tracking-tight sm:text-lg">tigabelas.</h1>
      </div>
      <div class="flex items-center gap-2">
        <a href="index.html" title="Calendar"
          class="flex h-10 items-center gap-2 rounded-xl border border-neutral-200 px-3 text-sm font-semibold text-neutral-700 transition hover:bg-neutral-100 dark:border-neutral-800 dark:text-neutral-300 dark:hover:bg-neutral-800">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z" /></svg>
        </a>
        <button id="themeToggle" type="button" title="Toggle theme"
          class="flex h-10 w-10 items-center justify-center rounded-xl border border-neutral-200 text-neutral-700 transition hover:bg-neutral-100 dark:border-neutral-800 dark:text-neutral-300 dark:hover:bg-neutral-800">
          <svg id="iconSun" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="4" /><path stroke-linecap="round" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg id="iconMoon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
        <!-- Upload (opens popup) -->
        <button id="uploadBtn" type="button" title="Upload photos"
          class="flex h-10 items-center gap-2 rounded-xl border border-neutral-200 px-3 text-sm font-semibold text-neutral-700 transition hover:bg-neutral-100 dark:border-neutral-800 dark:text-neutral-300 dark:hover:bg-neutral-800">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0L8 8m4-4l4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" /></svg>
          <span class="hidden sm:inline">Upload</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== Main ===== -->
  <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-12">
    <!-- Title -->
    <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h2 class="text-2xl font-bold tracking-tight sm:text-3xl">Photo Album</h2>
        <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-400">Moments captured from your events.</p>
      </div>
      <span id="photoCount" class="inline-flex w-fit items-center gap-1.5 rounded-full bg-neutral-100 px-3 py-1 text-xs font-semibold text-neutral-600 dark:bg-neutral-800 dark:text-neutral-300">
        <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="8.5" cy="8.5" r="1.5" /><path stroke-linecap="round" stroke-linejoin="round" d="M21 15l-5-5L5 21" /></svg>
        <span id="photoCountNum">0</span> photos
      </span>
    </div>

    <!-- Gallery (masonry) -->
    <div id="gallery" class="gap-4 [column-fill:_balance] sm:columns-2 lg:columns-3 xl:columns-4"></div>

    <!-- Empty state -->
    <div id="emptyHint" class="flex flex-col items-center justify-center rounded-3xl border border-dashed border-neutral-300 px-6 py-20 text-center dark:border-neutral-700">
      <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-neutral-100 text-neutral-400 dark:bg-neutral-800 dark:text-neutral-500">
        <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="8.5" cy="8.5" r="1.5" /><path stroke-linecap="round" stroke-linejoin="round" d="M21 15l-5-5L5 21" /></svg>
      </div>
      <h3 class="text-lg font-bold">No photos yet</h3>
      <p class="mt-1 max-w-xs text-sm text-neutral-500 dark:text-neutral-400">Click <span class="font-semibold">Upload</span> to add your event photos.</p>
    </div>
  </main>

  <footer class="mx-auto max-w-6xl px-4 pb-10 pt-2 text-center text-xs text-neutral-400 dark:text-neutral-600 sm:px-6">
    www.tgbls.com
  </footer>

  <!-- ===== Upload Modal ===== -->
  <div id="uploadModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div id="uploadBackdrop" class="absolute inset-0 bg-neutral-900/40 backdrop-blur-sm dark:bg-black/60 animate-fade-in"></div>
    <div class="relative z-10 w-full max-w-md rounded-2xl border border-neutral-200 bg-white p-5 shadow-xl dark:border-neutral-800 dark:bg-neutral-900 animate-pop-in">
      <div class="mb-4 flex items-center justify-between">
        <h3 class="text-lg font-bold">Upload Photos</h3>
        <button type="button" data-close-upload
          class="flex h-8 w-8 items-center justify-center rounded-lg text-neutral-400 transition hover:bg-neutral-100 hover:text-neutral-900 dark:hover:bg-neutral-800 dark:hover:text-white">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>

      <button type="button" id="dropzone"
        class="flex w-full flex-col items-center justify-center gap-3 rounded-2xl border-2 border-dashed border-neutral-300 px-6 py-10 text-center transition hover:border-neutral-400 hover:bg-neutral-100/60 dark:border-neutral-700 dark:hover:border-neutral-600 dark:hover:bg-neutral-800/40">
        <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-neutral-900 text-white dark:bg-white dark:text-neutral-900">
          <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0L8 8m4-4l4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" /></svg>
        </span>
        <span class="text-sm font-semibold">Drag &amp; drop photos here</span>
        <span class="text-xs text-neutral-500 dark:text-neutral-400">or click to choose from your folder · JPG / PNG</span>
      </button>
      <input id="fileInput" type="file" accept="image/*" multiple class="hidden" />
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="fixed inset-0 z-[55] hidden items-center justify-center bg-black/80 p-4 backdrop-blur-sm">
    <button type="button" id="lightboxClose" class="absolute right-4 top-4 flex h-10 w-10 items-center justify-center rounded-xl border border-white/30 text-white transition hover:bg-white/10">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" /></svg>
    </button>
    <figure class="flex max-h-[88vh] max-w-3xl flex-col items-center">
      <img id="lightboxImg" src="" alt="" class="max-h-[80vh] w-auto rounded-2xl object-contain shadow-2xl" />
      <figcaption id="lightboxCaption" class="mt-3 text-center text-sm text-white/80"></figcaption>
    </figure>
  </div>

  <!-- Toast container -->
  <div id="toastContainer" class="pointer-events-none fixed bottom-5 left-1/2 z-[60] flex -translate-x-1/2 flex-col items-center gap-2"></div>

  <script src="album.js"></script>
</body>
</html>
